<div class="change-password-page">
  <div class="change-password-card">
    <div class="brand-logo mb-4">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h2 class="card-title">Setup New Password</h2>
    <p class="card-subtitle">Temporary password detected. Please set a secure password to activate your account.</p>

    <div class="mt-4">
      <!-- Current Password Field -->
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <div class="input-group-custom">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="showCurrentPassword ? 'text' : 'password'"
            class="form-control form-control-lg ps-5 pe-5"
            id="current-password"
            [(ngModel)]="currentPassword"
            placeholder="Enter current password">
          <button class="password-toggle" type="button" (click)="togglePassword('current')" id="toggle-current-password">
            <i class="bi" [class.bi-eye]="!showCurrentPassword" [class.bi-eye-slash]="showCurrentPassword"></i>
          </button>
        </div>
      </div>

      <!-- New Password Field -->
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group-custom">
          <i class="bi bi-shield-plus input-icon"></i>
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            class="form-control form-control-lg ps-5 pe-5"
            id="new-password"
            [(ngModel)]="newPassword"
            placeholder="Enter new password">
          <button class="password-toggle" type="button" (click)="togglePassword('new')" id="toggle-new-password">
            <i class="bi" [class.bi-eye]="!showNewPassword" [class.bi-eye-slash]="showNewPassword"></i>
          </button>
        </div>
        <div class="form-text mt-1 text-muted-custom">Password must be at least 6 characters long.</div>
      </div>

      <!-- Confirm Password Field -->
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <div class="input-group-custom">
          <i class="bi bi-shield-check input-icon"></i>
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-control form-control-lg ps-5 pe-5"
            id="confirm-password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password">
          <button class="password-toggle" type="button" (click)="togglePassword('confirm')" id="toggle-confirm-password">
            <i class="bi" [class.bi-eye]="!showConfirmPassword" [class.bi-eye-slash]="showConfirmPassword"></i>
          </button>
        </div>
      </div>

      <!-- Success & Error Messages -->
      @if (errorMessage) {
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" id="change-password-error">
          <i class="bi bi-exclamation-circle-fill"></i>
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="alert alert-success d-flex align-items-center gap-2 mb-3" id="change-password-success">
          <i class="bi bi-check-circle-fill"></i>
          {{ successMessage }}
        </div>
      }

      <!-- Submit Button -->
      <button
        class="btn btn-primary btn-lg w-100 mt-2"
        (click)="onSubmit()"
        id="change-password-btn"
        [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm me-2"></span>
          Saving Password...
        } @else {
          <i class="bi bi-save me-1"></i>
          Change Password & Continue
        }
      </button>
    </div>
  </div>
</div>
